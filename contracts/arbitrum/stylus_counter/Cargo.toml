[package]
name = "arbitrum-stylus-academy-counter"
version = "0.1.0"
edition = "2021"
description = "WASM-Compliant Arbitrum Stylus Smart Contract for Developer Academy Certification Tracking"
license = "MIT"

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = "0.7.0"
alloy-sol-types = "0.7.0"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
